services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: voies
      POSTGRES_USER: voies
      POSTGRES_PASSWORD: voies
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voies -d voies"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://voies:voies@postgres:5432/voies
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
